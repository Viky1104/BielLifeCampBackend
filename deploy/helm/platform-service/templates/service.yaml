apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform-service.name" . }}
  labels: {app.kubernetes.io/name: {{ include "platform-service.name" . }}}
spec:
  selector: {app.kubernetes.io/name: {{ include "platform-service.name" . }}}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
