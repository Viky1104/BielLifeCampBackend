apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-service.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "platform-service.name" . }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "platform-service.name" . }}}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "platform-service.name" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: {{ .Values.service.port }}}]
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: {{ .Values.config.springProfilesActive | quote }}}
            - {name: NACOS_ENABLED, value: {{ .Values.config.nacosEnabled | quote }}}
            - {name: NACOS_SERVER_ADDR, value: {{ .Values.config.nacosServerAddr | quote }}}
            - {name: NACOS_NAMESPACE, value: {{ .Values.config.nacosNamespace | quote }}}
            - {name: NACOS_GROUP, value: {{ .Values.config.nacosGroup | quote }}}
            - {name: NACOS_CLUSTER_NAME, value: {{ .Values.config.nacosClusterName | quote }}}
            - {name: SPRING_CLOUD_NACOS_DISCOVERY_CLUSTER_NAME, value: {{ .Values.config.nacosClusterName | quote }}}
            - {name: NACOS_LOADBALANCER_ENABLED, value: {{ .Values.config.nacosLoadBalancerEnabled | quote }}}
            - {name: SPRING_CLOUD_LOADBALANCER_NACOS_ENABLED, value: {{ .Values.config.nacosLoadBalancerEnabled | quote }}}
          {{- if or .Values.secretRef .Values.additionalSecretRefs }}
          envFrom:
          {{- if .Values.secretRef }}
            - {secretRef: {name: {{ .Values.secretRef | quote }}}}
          {{- end }}
          {{- range .Values.additionalSecretRefs }}
            - {secretRef: {name: {{ . | quote }}}}
          {{- end }}
          {{- end }}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: http}, initialDelaySeconds: 15, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: http}, initialDelaySeconds: 30, periodSeconds: 15}
          startupProbe: {httpGet: {path: /actuator/health/liveness, port: http}, failureThreshold: 30, periodSeconds: 5}
          lifecycle: {preStop: {exec: {command: ["sh", "-c", "sleep 10"]}}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: logs, mountPath: /logs}
            - {name: nacos-cache, mountPath: /nacos}
          {{- range .Values.secretVolumes }}
            - {name: {{ .name | quote }}, mountPath: {{ .mountPath | quote }}, readOnly: true}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        - name: logs
          emptyDir: {sizeLimit: 512Mi}
        - name: nacos-cache
          emptyDir: {sizeLimit: 128Mi}
      {{- range .Values.secretVolumes }}
        - name: {{ .name | quote }}
          secret:
            secretName: {{ .secretName | quote }}
            defaultMode: 0440
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: {{ include "platform-service.name" . }}}}
