apiVersion: v1
kind: Service
metadata:
  name: sentinel-dashboard
  namespace: platform-infra
spec:
  selector: {app.kubernetes.io/name: sentinel-dashboard}
  ports: [{name: http, port: 8858, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-dashboard
  namespace: platform-infra
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: sentinel-dashboard}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sentinel-dashboard}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: dashboard
          image: registry.example.invalid/platform/sentinel-dashboard:1.8.9
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8858}]
          envFrom: [{secretRef: {name: sentinel-dashboard-secret}}]
          readinessProbe: {tcpSocket: {port: http}, initialDelaySeconds: 15, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: http}, initialDelaySeconds: 30, periodSeconds: 15}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
