apiVersion: v1
kind: Service
metadata:
  name: xxl-job-admin
  namespace: platform-infra
spec:
  selector: {app.kubernetes.io/name: xxl-job-admin}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xxl-job-admin
  namespace: platform-infra
spec:
  replicas: 2
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: xxl-job-admin}
  template:
    metadata:
      labels: {app.kubernetes.io/name: xxl-job-admin}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: admin
          image: xuxueli/xxl-job-admin:3.4.0
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{secretRef: {name: xxl-job-admin-secret}}]
          readinessProbe: {httpGet: {path: /xxl-job-admin/actuator/health, port: http}, initialDelaySeconds: 30, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /xxl-job-admin/actuator/health, port: http}, initialDelaySeconds: 60, periodSeconds: 15}
          startupProbe: {httpGet: {path: /xxl-job-admin/actuator/health, port: http}, failureThreshold: 30, periodSeconds: 5}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "1", memory: 2Gi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: xxl-job-admin
  namespace: platform-infra
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: xxl-job-admin}
