apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: biel-life-camp-redis-essd-retain
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: biel-life-camp
    lifecamp.biel.com/environment: dev
provisioner: diskplugin.csi.alibabacloud.com
parameters:
  fstype: ext4
  type: cloud_essd
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: biel-life-camp
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: biel-life-camp
automountServiceAccountToken: false
imagePullSecrets:
  - name: acr-credential-secret-aggregation
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-dev-config
  namespace: biel-life-camp
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-dev
    app.kubernetes.io/part-of: biel-life-camp
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    protected-mode yes
    daemonize no
    supervised no
    logfile ""
    dir /data
    dbfilename dump.rdb
    save 900 1
    save 300 10
    save 60 10000
    stop-writes-on-bgsave-error yes
    rdbcompression yes
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec
    no-appendfsync-on-rewrite no
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    aclfile /etc/redis-auth/users.acl
    maxclients 1000
    maxmemory 768mb
    maxmemory-policy allkeys-lru
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: biel-life-camp
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-dev
    app.kubernetes.io/part-of: biel-life-camp
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-dev
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: biel-life-camp
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-dev
    app.kubernetes.io/part-of: biel-life-camp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-dev
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: biel-life-camp
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-dev
    app.kubernetes.io/part-of: biel-life-camp
spec:
  serviceName: redis-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: redis-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: redis-dev
        app.kubernetes.io/part-of: biel-life-camp
        lifecamp.biel.com/environment: dev
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: boen-registry-vpc.cn-shenzhen.cr.aliyuncs.com/biel_client/redis@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - /etc/redis/redis.conf
          ports:
            - name: redis
              containerPort: 6379
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - REDISCLI_AUTH="$(cat /etc/redis-auth/password)" exec redis-cli --user app -h 127.0.0.1 ping
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - REDISCLI_AUTH="$(cat /etc/redis-auth/password)" exec redis-cli --user app -h 127.0.0.1 ping
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 1
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - REDISCLI_AUTH="$(cat /etc/redis-auth/password)" exec redis-cli --user app -h 127.0.0.1 ping
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-config
              mountPath: /etc/redis/redis.conf
              subPath: redis.conf
              readOnly: true
            - name: redis-auth
              mountPath: /etc/redis-auth/users.acl
              subPath: users.acl
              readOnly: true
            - name: redis-auth
              mountPath: /etc/redis-auth/password
              subPath: password
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: redis-config
          configMap:
            name: redis-dev-config
            defaultMode: 0444
        - name: redis-auth
          secret:
            secretName: redis-dev-secret
            defaultMode: 0440
            items:
              - key: users.acl
                path: users.acl
              - key: REDIS_PASSWORD
                path: password
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: redis-data
        labels:
          app.kubernetes.io/name: redis
          app.kubernetes.io/instance: redis-dev
          app.kubernetes.io/part-of: biel-life-camp
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: biel-life-camp-redis-essd-retain
        resources:
          requests:
            storage: 20Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  namespace: biel-life-camp
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-dev
    app.kubernetes.io/part-of: biel-life-camp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: redis-dev
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: biel-life-camp
      ports:
        - protocol: TCP
          port: 6379
