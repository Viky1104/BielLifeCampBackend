spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          # 只允许本文件中经过评审的显式路由，禁止按注册中心自动暴露服务。
          discovery:
            locator:
              enabled: false
          # 路由统一使用 YAML 管理，后续可将本段完整迁移到 Nacos 的 gateway.yaml。
          # 人工 EHR 同步仍同步执行，其专用路由必须位于普通 system-service 路由之前。
          routes:
            - id: system-service-ehr-sync
              uri: lb://system-service
              predicates:
                - Path=/api/system/v1/ehr-sync-runs
                - Method=POST
              metadata:
                # Spring Cloud Gateway 路由级响应超时使用毫秒数值，当前为 10 分钟。
                response-timeout: 600000
            - id: system-service
              uri: lb://system-service
              predicates:
                - Path=/api/system/**
            - id: communication-service
              uri: lb://communication-service
              predicates:
                - Path=/api/communications/**
            - id: workbench-service
              uri: lb://workbench-service
              predicates:
                - Path=/api/workbench/**
            - id: points-service
              uri: lb://points-service
              predicates:
                - Path=/api/points/**
            - id: activity-service
              uri: lb://activity-service
              predicates:
                - Path=/api/activities/**
            - id: community-service
              uri: lb://community-service
              predicates:
                - Path=/api/community/**
            - id: mall-service
              uri: lb://mall-service
              predicates:
                - Path=/api/mall/**
            - id: life-service
              uri: lb://life-service
              predicates:
                - Path=/api/life/**
            - id: order-view-service
              uri: lb://order-view-service
              predicates:
                - Path=/api/order-views/**
            # OpenAPI 文档使用独立只读路由，不修改业务服务现有接口前缀。
            - id: system-service-openapi
              uri: lb://system-service
              predicates:
                - Path=/openapi/system-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: communication-service-openapi
              uri: lb://communication-service
              predicates:
                - Path=/openapi/communication-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: workbench-service-openapi
              uri: lb://workbench-service
              predicates:
                - Path=/openapi/workbench-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: points-service-openapi
              uri: lb://points-service
              predicates:
                - Path=/openapi/points-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: activity-service-openapi
              uri: lb://activity-service
              predicates:
                - Path=/openapi/activity-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: community-service-openapi
              uri: lb://community-service
              predicates:
                - Path=/openapi/community-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: mall-service-openapi
              uri: lb://mall-service
              predicates:
                - Path=/openapi/mall-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: life-service-openapi
              uri: lb://life-service
              predicates:
                - Path=/openapi/life-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: order-view-service-openapi
              uri: lb://order-view-service
              predicates:
                - Path=/openapi/order-view-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
          # 转发连接失败快速释放请求；响应超时按业务接口整体预算控制。
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:30s}
            compression: true
          # OPTIONS 预检在 Gateway 直接处理，不进入认证和下游负载均衡链路。
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - ${GATEWAY_CORS_ALLOWED_ORIGIN_1:http://localhost:5173}
                  - ${GATEWAY_CORS_ALLOWED_ORIGIN_2:http://127.0.0.1:5173}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - Idempotency-Key
                  - X-Request-Id
                exposedHeaders:
                  - X-Request-Id
                allowCredentials: ${GATEWAY_CORS_ALLOW_CREDENTIALS:false}
                maxAge: ${GATEWAY_CORS_MAX_AGE_SECONDS:3600}
    loadbalancer:
      # 默认使用 RoundRobinLoadBalancer；禁止网关自动重试非幂等业务请求。
      retry:
        enabled: false
      cache:
        enabled: true
        ttl: ${GATEWAY_LB_CACHE_TTL:10s}
        capacity: ${GATEWAY_LB_CACHE_CAPACITY:256}
      stats:
        micrometer:
          enabled: true
      # 提前创建固定服务的负载均衡上下文，避免每个服务首次请求承担初始化延迟。
      eager-load:
        clients:
          - system-service
          - communication-service
          - workbench-service
          - points-service
          - activity-service
          - community-service
          - mall-service
          - life-service
          - order-view-service
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
    sentinel:
      enabled: ${SENTINEL_ENABLED:false}
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
logging:
  structured:
    format:
      console: ecs
# API 文档默认关闭，由各环境在 Nacos 中显式启用。
# 开启后由 Gateway 聚合显式批准的业务服务 OpenAPI 3 文档。
platform:
  api-docs:
    enabled: ${KNIFE4J_ENABLED:true}
    basic-enabled: ${KNIFE4J_BASIC_ENABLED:false}
    username: ${KNIFE4J_BASIC_USERNAME:}
    password: ${KNIFE4J_BASIC_PASSWORD:}
  gateway-auth:
    enabled: ${GATEWAY_AUTH_ENABLED:true}
    external-issuer: ${AUTH_ISSUER:biel-life-camp}
    external-audience: ${AUTH_AUDIENCE:biel-life-camp-gateway}
    external-public-key-location: ${AUTH_PUBLIC_KEY:}
    internal-issuer: ${INTERNAL_IDENTITY_ISSUER:biel-life-camp-gateway}
    internal-key-id: ${INTERNAL_IDENTITY_KEY_ID:change-me}
    internal-private-key-location: ${INTERNAL_IDENTITY_PRIVATE_KEY:}
    internal-public-key-location: ${INTERNAL_IDENTITY_PUBLIC_KEY:}
    gateway-service-token: ${AUTH_GATEWAY_SERVICE_TOKEN:}
    system-authorization-uri: ${SYSTEM_AUTHORIZATION_URI:http://system-service:8081/internal/system/v1/auth/session-context}
    require-https: ${GATEWAY_AUTH_REQUIRE_HTTPS:true}
