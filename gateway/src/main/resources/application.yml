spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          # 安全兜底：禁止根据注册中心自动生成并暴露路由。
          discovery:
            locator:
              enabled: false
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
    sentinel:
      enabled: ${SENTINEL_ENABLED:false}
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
logging:
  structured:
    format:
      console: ecs
