spring:
  application:
    name: system-service
  # 数据库迁移只能由经过评审的独立流程显式开启。
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
    sentinel:
      enabled: ${SENTINEL_ENABLED:false}
# 接口与持久层扫描规则属于代码结构，不由环境配置覆盖。
springdoc:
  paths-to-match: /api/**
mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
logging:
  structured:
    format:
      console: ecs
